[package]
name = "relay-gate"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Read-only NewAPI Relay Gate core (agent-native CLI)"
license = "MIT"

[lib]
name = "relay_gate"
path = "src/lib.rs"

[[bin]]
name = "relay-gate"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive", "cargo"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
opt-level = 0
debug = true

[profile.dev.package."*"]
opt-level = 3
